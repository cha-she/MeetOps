name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ml/src/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "ml/src/**"

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -e ml -r backend/requirements.txt
      - name: Train the classifier (models are not stored in Git)
        run: python -m meetops_ml.train --version v3 --train ml/data/labeled/train_v2.csv --features full --folds 2
      - run: python -m pytest
        working-directory: backend
