[project]
name = "meetops-backend"
version = "0.1.0"
description = "FastAPI backend for the MeetOps meeting intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.1",
    "dateparser>=1.2",
    "spacy>=3.8,<3.9",
    "scikit-learn>=1.5",
    "meetops-ml",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
