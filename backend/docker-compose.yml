services:
  db:
    image: postgres:16-alpine
    container_name: meetops-postgres
    environment:
      POSTGRES_USER: meetops
      POSTGRES_PASSWORD: meetops
      POSTGRES_DB: meetops
    ports:
      - "5432:5432"
    volumes:
      - meetops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  meetops_pgdata:
